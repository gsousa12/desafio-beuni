version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: beuni-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beuni}
      POSTGRES_USER: ${POSTGRES_USER:-beuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beuni}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - beuni_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beuni} -d ${POSTGRES_DB:-beuni}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: beuni-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - beuni_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  default:
    name: beuni-net

volumes:
  beuni_pg_data:
  beuni_redis_data:
